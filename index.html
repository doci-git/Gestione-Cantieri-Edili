<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Gestione Cantieri Edili</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-alt: #f8fafc;
        --text: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --border-light: #f1f5f9;
        --accent: #f59e0b;
        --accent-hover: #d97706;
        --accent-light: #fef3c7;
        --accent-subtle: #fffbeb;
        --success: #10b981;
        --success-light: #d1fae5;
        --danger: #ef4444;
        --danger-light: #fee2e2;
        --info: #3b82f6;
        --info-light: #dbeafe;
        --warning: #f59e0b;
        --warning-light: #fef3c7;
        --slate: #1e293b;
        --slate-light: #334155;
        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --shadow-sm:
          0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
        --shadow-lg:
          0 12px 32px rgba(0, 0, 0, 0.1), 0 4px 8px rgba(0, 0, 0, 0.05);
        --shadow-xl:
          0 20px 48px rgba(0, 0, 0, 0.14), 0 8px 16px rgba(0, 0, 0, 0.06);
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
        -webkit-tap-highlight-color: transparent;
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      body.app-locked > *:not(#passwordGate) {
        visibility: hidden;
      }

      .password-gate {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--slate);
      }
      .password-gate-card {
        width: min(100%, 380px);
        padding: 28px 24px;
        background: var(--surface);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-xl);
        text-align: center;
      }
      .password-gate-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        background: var(--accent-light);
        font-size: 1.8rem;
      }
      .password-gate h2 {
        margin-bottom: 6px;
        color: var(--slate);
        font-size: 1.35rem;
      }
      .password-gate p {
        margin-bottom: 18px;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }
      .password-gate input {
        width: 100%;
        padding: 13px 14px;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-alt);
        color: var(--text);
        font: inherit;
        text-align: center;
      }
      .password-gate input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-light);
      }
      .password-gate button {
        width: 100%;
        margin-top: 10px;
        padding: 13px;
        border: 0;
        border-radius: 24px;
        background: var(--accent);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      .password-gate button:hover {
        background: var(--accent-hover);
      }
      .password-error {
        min-height: 21px;
        margin: 10px 0 0;
        color: var(--danger) !important;
        font-size: 0.8rem !important;
      }

      button,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }

      /* ─── Header ─────────────────────── */
      .app-header {
        background: var(--slate);
        color: #fff;
        padding: 0 max(16px, env(safe-area-inset-right)) 0
          max(16px, env(safe-area-inset-left));
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        user-select: none;
      }
      .app-header .logo-icon {
        width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .app-header h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .app-header .header-spacer {
        flex: 1;
      }
      .btn-header {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        transition: var(--transition);
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-header:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.35);
      }
      .btn-header:active {
        transform: scale(0.96);
      }
      .btn-back {
        background: transparent;
        border: none;
        color: #fff;
        cursor: pointer;
        font-size: 1.3rem;
        padding: 6px 8px;
        border-radius: 50%;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      .btn-back:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* ─── Main Container ─────────────── */
      .main-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
        padding-bottom: calc(80px + env(safe-area-inset-bottom));
      }
      @media (min-width: 768px) {
        .main-container {
          padding: 24px 20px 60px;
        }
      }

      /* ─── Dashboard ──────────────────── */
      .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      @media (min-width: 500px) {
        .dashboard-stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (min-width: 768px) {
        .dashboard-stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 10px;
        }
      }
      .stat-mini-card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 11px 8px;
        box-shadow: var(--shadow-sm);
        text-align: center;
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .stat-mini-card .stat-value {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--slate);
        font-family: var(--font-mono);
      }
      .stat-mini-card .stat-value.positive {
        color: var(--success);
      }
      .stat-mini-card .stat-value.negative {
        color: var(--danger);
      }
      .stat-mini-card .stat-value.extra {
        color: #e29b00;
      }
      .stat-mini-card .stat-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-secondary);
        margin-top: 2px;
        font-weight: 600;
      }
      .section-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .section-title-row h2 {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--slate);
      }
      .dashboard-tools {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin: -2px 0 12px;
      }
      .search-input {
        padding: 10px 14px;
        border: 2px solid var(--border);
        border-radius: 24px;
        font-size: 0.9rem;
        width: 100%;
        max-width: 280px;
        transition: var(--transition);
        background: var(--surface);
        font-family: var(--font);
      }
      .search-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-light);
      }

      .sites-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 600px) {
        .sites-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 14px;
        }
      }
      @media (min-width: 900px) {
        .sites-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }
      }

      .site-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 18px 16px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: var(--transition);
        border: 2px solid transparent;
        position: relative;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      .site-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
        border-color: var(--accent);
      }
      .site-card:focus-visible {
        outline: 3px solid var(--info);
        outline-offset: 3px;
      }
      .site-card:active {
        transform: scale(0.98);
      }
      .site-card .unpaid-dot {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 3px var(--danger-light);
      }
      .site-card .card-status {
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .status-preventivo {
        background: var(--info-light);
        color: #1d4ed8;
      }
      .status-in-corso {
        background: var(--warning-light);
        color: #b45309;
      }
      .status-terminato {
        background: var(--success-light);
        color: #065f46;
      }
      .site-card .card-client {
        font-size: 0.8rem;
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 2px;
      }
      .site-card .card-name {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--slate);
        margin-bottom: 10px;
        letter-spacing: -0.01em;
        padding-right: 80px;
      }
      .site-card .card-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        font-size: 0.78rem;
      }
      .site-card .card-metric {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
        border-bottom: 1px dotted var(--border-light);
      }
      .site-card .card-metric span:first-child {
        color: var(--text-secondary);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-weight: 600;
      }
      .site-card .card-metric span:last-child {
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.78rem;
      }
      .card-profit-positive {
        color: var(--success);
      }
      .card-profit-negative {
        color: var(--danger);
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
      }
      .empty-state .empty-icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }
      .empty-state p {
        font-size: 0.95rem;
        margin-bottom: 6px;
      }

      .fab {
        position: fixed;
        bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
        right: max(20px, calc(env(safe-area-inset-right) + 12px));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--text);
        border: none;
        font-size: 1.6rem;
        cursor: pointer;
        box-shadow: var(--shadow-xl);
        z-index: 90;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .fab:hover {
        background: var(--accent-hover);
        transform: translateY(-3px);
        box-shadow: 0 24px 48px rgba(245, 158, 11, 0.35);
      }
      .fab:active {
        transform: scale(0.9);
      }
      @media (min-width: 768px) {
        .fab {
          bottom: 28px;
          right: 28px;
          width: 60px;
          height: 60px;
          font-size: 1.8rem;
        }
      }

      /* ─── Site Detail ────────────────── */
      .detail-summary-bar {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 14px 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        margin-bottom: 16px;
        border: 1px solid var(--border);
        position: sticky;
        top: 64px;
        z-index: 50;
        flex-wrap: nowrap;
      }
      @media (min-width: 768px) {
        .detail-summary-bar {
          flex-wrap: wrap;
          justify-content: space-around;
          gap: 8px;
          overflow-x: visible;
          padding: 16px 10px;
        }
      }
      .detail-summary-item {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: center;
        padding: 8px 10px;
        scroll-snap-align: start;
        border-radius: var(--radius-sm);
        transition: var(--transition);
      }
      @media (min-width: 768px) {
        .detail-summary-item {
          min-width: 100px;
          flex: 1 1 auto;
        }
      }
      .detail-summary-value {
        font-size: 1.1rem;
        font-weight: 700;
        font-family: var(--font-mono);
        letter-spacing: -0.02em;
        color: var(--slate);
      }
      .detail-summary-value.green {
        color: var(--success);
      }
      .detail-summary-value.red {
        color: var(--danger);
      }
      .detail-summary-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        font-weight: 700;
        margin-top: 1px;
      }
      .detail-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin: 0 0 14px;
        border-bottom: 1px solid var(--border);
        scrollbar-width: thin;
      }
      .detail-tab {
        flex: 0 0 auto;
        padding: 10px 14px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
      }
      .detail-tab[aria-pressed="true"] {
        border-bottom-color: var(--accent-hover);
        color: var(--text);
      }
      .detail-tab:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: -2px;
      }
      @media (max-width: 599px) {
        .detail-tab {
          padding: 9px 8px;
          font-size: 0.76rem;
        }
        .app-header #btnReportPdf,
        .app-header #btnEditSite {
          width: 44px;
          min-width: 44px;
          padding: 8px;
          justify-content: center;
          gap: 0;
        }
        .app-header .header-action-label {
          display: none;
        }
      }

      .detail-section {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .detail-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .detail-section-header h3 {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--slate);
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .expense-category-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 4px 14px;
        margin: 0 0 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-light);
      }
      .expense-category-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--text-secondary);
        font-size: 0.78rem;
      }
      .expense-category-row strong {
        color: var(--text);
        font-family: var(--font-mono);
        white-space: nowrap;
      }
      .section-icon {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .icon-quote {
        background: #e0e7ff;
        color: #4338ca;
      }
      .icon-expense {
        background: #fee2e2;
        color: #dc2626;
      }
      .icon-labor {
        background: #fef3c7;
        color: #d97706;
      }
      .icon-extra {
        background: #fce7f3;
        color: #be185d;
      }
      .icon-collection {
        background: #d1fae5;
        color: #059669;
      }
      .icon-doc {
        background: #e0f2fe;
        color: #0284c7;
      }
      .icon-reminder {
        background: #f3e8ff;
        color: #7c3aed;
      }

      .btn-sm {
        padding: 7px 14px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.78rem;
        transition: var(--transition);
        font-family: var(--font);
        letter-spacing: 0.01em;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .btn-sm:active {
        transform: scale(0.94);
      }
      .btn-accent {
        background: var(--accent);
        color: var(--text);
      }
      .btn-accent:hover {
        background: var(--accent-hover);
      }
      .btn-outline {
        background: transparent;
        border: 2px solid var(--border);
        color: var(--text);
      }
      .btn-outline:hover {
        border-color: var(--accent);
        background: var(--accent-subtle);
      }
      .btn-danger-sm {
        background: transparent;
        border: none;
        color: var(--danger);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        transition: var(--transition);
        font-weight: 600;
      }
      .btn-danger-sm:hover {
        background: var(--danger-light);
      }

      .item-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 300px;
        overflow-y: auto;
      }
      .item-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--surface-alt);
        border-radius: var(--radius-sm);
        gap: 8px;
        flex-wrap: wrap;
        font-size: 0.85rem;
        border: 1px solid transparent;
        transition: var(--transition);
      }
      .item-list li:hover {
        border-color: var(--border);
      }
      .item-info {
        flex: 1;
        min-width: 120px;
      }
      .item-info .item-desc {
        font-weight: 600;
        color: var(--text);
      }
      .item-info .item-meta {
        font-size: 0.7rem;
        color: var(--text-muted);
      }
      .expense-photo-link {
        display: inline-flex;
        margin-top: 6px;
        width: 64px;
        height: 48px;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        cursor: zoom-in;
      }
      .expense-photo-link img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .expense-photo-preview {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .expense-photo-preview img {
        width: 88px;
        height: 66px;
        object-fit: cover;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      .expense-photo-preview span {
        color: var(--text-secondary);
        font-size: 0.8rem;
      }
      .photo-lightbox {
        position: fixed;
        inset: 0;
        z-index: 2500;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        padding: max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        background: rgba(15, 23, 42, 0.94);
      }
      .photo-lightbox[hidden] {
        display: none;
      }
      .photo-lightbox-close {
        justify-self: end;
        min-width: 44px;
        min-height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font: inherit;

    <script>
      (function () {

        const ACCESS_PASSWORD = "1122";

          (value) => value.startsWith("INSERISCI_"),
        );
        const CLOUD_DOCUMENT = "gestione-cantieri/dati-condivisi";
        let sites = [];

        let currentView = "dashboard"; // 'dashboard' | 'detail'
        let currentDetailTab = "accounting";

        function normalizeSites(value) {
          sites = Array.isArray(value) ? value : [];
          sites.forEach((s) => {
            s.expenses = s.expenses || [];
            s.expenses.forEach((expense) => {
              expense.category = expense.category || "Non categorizzata";
            });
            s.labor = s.labor || [];
            s.extraWork = s.extraWork || [];
            s.extraWork.forEach((extra) => {
              extra.collected = parseFloat(extra.collected) || 0;
            });
            s.collections = s.collections || [];
            s.documents = s.documents || [];
            s.reminders = s.reminders || [];
            s.quoteNotes = s.quoteNotes || "";
            s.status = s.status || "Preventivo";
            s.completionDate = s.completionDate || "";
          });
        }

        function normalizeActivityLog(value) {
          activityLog = Array.isArray(value) ? value.slice(0, 100) : [];
        }

        async function loadData() {
          let shouldSeedDemoData = false;
          let storageAvailable = true;
          let raw = null;
          try {
            raw = localStorage.getItem(STORAGE_KEY);
          } catch (e) {
            storageAvailable = false;
            console.error("Errore accesso archivio locale:", e);
          }
          if (raw) {
            try {
              normalizeSites(JSON.parse(raw));
            } catch (e) {
              console.error("Errore caricamento cantieri:", e);
              sites = [];
              showToast(
                "⚠️ Archivio cantieri non leggibile: importa un backup",
              );
            }
          } else if (storageAvailable && raw === null) {
            shouldSeedDemoData = true;
          }
          try {
            normalizeActivityLog(
              JSON.parse(
                localStorage.getItem(STORAGE_KEY + "_activity") || "[]",
              ),
            );
          } catch (e) {
            console.error("Errore caricamento storico attività:", e);
            activityLog = [];
          }
          if (!storageAvailable) {
            sites = [];
          }
          if (shouldSeedDemoData) {
            seedDemoData();
          }
          cloudSyncedSites = JSON.parse(JSON.stringify(sites));
          cloudSyncedActivityLog = JSON.parse(JSON.stringify(activityLog));

          if (FIREBASE_CONFIGURED && typeof firebase !== "undefined") {
            await connectToCloud();
          }
        }

        function sameData(left, right) {
          return JSON.stringify(left) === JSON.stringify(right);
        }

        function mergeCloudRecords(baseRecords, localRecords, remoteRecords) {
          const baseById = new Map(
            (baseRecords || []).map((item) => [item.id, item]),
          );
          const localById = new Map(
            (localRecords || []).map((item) => [item.id, item]),
          );
          const remoteById = new Map(
            (remoteRecords || []).map((item) => [item.id, item]),
          );
          const merged = [];

          (remoteRecords || []).forEach((remoteItem) => {
            const baseItem = baseById.get(remoteItem.id);
            const localItem = localById.get(remoteItem.id);
            if (baseItem && !localItem) return;
            if (!baseItem || !localItem || sameData(baseItem, localItem)) {
              merged.push(remoteItem);
              return;
            }
            const mergedItem = { ...remoteItem };
            new Set([
              ...Object.keys(baseItem),
              ...Object.keys(localItem),
            ]).forEach((key) => {
              if (!sameData(baseItem[key], localItem[key])) {
                if (Object.prototype.hasOwnProperty.call(localItem, key)) {
                  mergedItem[key] = localItem[key];
                } else {
                  delete mergedItem[key];
                }
              }
            });
            merged.push(mergedItem);
          });

          (localRecords || []).forEach((localItem) => {
            if (!baseById.has(localItem.id) && !remoteById.has(localItem.id))
              merged.push(localItem);
            if (
              baseById.has(localItem.id) &&
              !remoteById.has(localItem.id) &&
              !sameData(baseById.get(localItem.id), localItem)
            )
              merged.push(localItem);
          });
          return merged;
        }

        function mergeCloudSites(baseSites, localSites, remoteSites) {
          const baseById = new Map(
            (baseSites || []).map((site) => [site.id, site]),
          );
          const localById = new Map(
            (localSites || []).map((site) => [site.id, site]),
          );
          const remoteById = new Map(
            (remoteSites || []).map((site) => [site.id, site]),
          );
          const recordArrays = new Set([
            "expenses",
            "labor",
            "extraWork",
            "collections",
            "documents",
            "reminders",
          ]);
          const merged = [];

          (remoteSites || []).forEach((remoteSite) => {
            const baseSite = baseById.get(remoteSite.id);
            const localSite = localById.get(remoteSite.id);
            if (baseSite && !localSite) return;
            if (!baseSite || !localSite || sameData(baseSite, localSite)) {
              merged.push(remoteSite);
              return;
            }
            const mergedSite = { ...remoteSite };
            new Set([
              ...Object.keys(baseSite),
              ...Object.keys(localSite),
            ]).forEach((key) => {
              if (sameData(baseSite[key], localSite[key])) return;
              if (!Object.prototype.hasOwnProperty.call(localSite, key)) {
                delete mergedSite[key];
              } else if (recordArrays.has(key)) {
                mergedSite[key] = mergeCloudRecords(
                  baseSite[key],
                  localSite[key],
                  remoteSite[key],
                );
              } else {
                mergedSite[key] = localSite[key];
              }
            });
            merged.push(mergedSite);
          });

          (localSites || []).forEach((localSite) => {
            if (!baseById.has(localSite.id) && !remoteById.has(localSite.id))
              merged.push(localSite);
            if (
              baseById.has(localSite.id) &&
              !remoteById.has(localSite.id) &&
              !sameData(baseById.get(localSite.id), localSite)
            )
              merged.push(localSite);
          });
          return merged;
        }

        function mergeActivityLogs(baseLog, localLog, remoteLog) {
          const keyFor = (entry) => entry.id || JSON.stringify(entry);
          const baseByKey = new Map(
            (baseLog || []).map((entry) => [keyFor(entry), entry]),
          );
          const localByKey = new Map(
            (localLog || []).map((entry) => [keyFor(entry), entry]),
          );
          const remoteByKey = new Map(
            (remoteLog || []).map((entry) => [keyFor(entry), entry]),
          );
          const merged = new Map();

          remoteByKey.forEach((remoteEntry, key) => {
            const baseEntry = baseByKey.get(key);
            const localEntry = localByKey.get(key);
            if (baseEntry && !localEntry) return;
            merged.set(key, baseEntry && localEntry ? localEntry : remoteEntry);
          });
          localByKey.forEach((localEntry, key) => {
            if (!baseByKey.has(key)) merged.set(key, localEntry);
          });

          return [...merged.values()]
            .sort(
              (left, right) =>
                new Date(right.timestamp).getTime() -
                new Date(left.timestamp).getTime(),
            )
            .slice(0, 100);
        }

        function saveData(activity, amount = null, siteName = null) {
          const sitesSnapshot = JSON.parse(JSON.stringify(sites));
          if (activity) {
            const currentSite = sites.find((site) => site.id === currentSiteId);
            activityLog.unshift({
              id: generateId(),
              text: activity,
              amount: amount === null ? null : parseFloat(amount) || 0,
              siteName: siteName || (currentSite ? currentSite.name : null),
              timestamp: new Date().toISOString(),
            });
            activityLog = activityLog.slice(0, 100);
          }

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sitesSnapshot));
            localStorage.setItem(
              STORAGE_KEY + "_activity",
              JSON.stringify(activityLog),
            );
          } catch (e) {
            showToast("⚠️ Spazio di archiviazione esaurito");
          }

          if (firestore) {
            const baseSnapshot = JSON.parse(JSON.stringify(cloudSyncedSites));
            const baseActivitySnapshot = JSON.parse(
              JSON.stringify(cloudSyncedActivityLog),
            );
            const activitySnapshot = JSON.parse(JSON.stringify(activityLog));
            cloudWritePromise = cloudWritePromise
              .catch(() => {})
              .then(() =>
                firestore.runTransaction(async (transaction) => {
                  const documentRef = firestore.doc(CLOUD_DOCUMENT);
                  const document = await transaction.get(documentRef);
                  const remoteData = document.exists ? document.data() : {};
                  const mergedSites = mergeCloudSites(
                    baseSnapshot,
                    sitesSnapshot,
                    Array.isArray(remoteData.sites) ? remoteData.sites : [],
                  );
                  const mergedActivity = mergeActivityLogs(
                    baseActivitySnapshot,
                    activitySnapshot,
                    remoteData.activityLog,
                  );
                  transaction.set(documentRef, {
                    sites: mergedSites,
                    activityLog: mergedActivity,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                  });
                  return { mergedSites, mergedActivity };
                }),
              )
              .then((result) => {
                cloudSyncedSites = JSON.parse(
                  JSON.stringify(result.mergedSites),
                );
                activityLog = result.mergedActivity;
                cloudSyncedActivityLog = JSON.parse(
                  JSON.stringify(result.mergedActivity),
                );
                localStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify(result.mergedSites),
                );
                localStorage.setItem(
                  STORAGE_KEY + "_activity",
                  JSON.stringify(result.mergedActivity),
                );
              })
              .catch((error) => {
                console.error("Errore sincronizzazione Firebase:", error);
                showToast("⚠️ Modifica in attesa di sincronizzazione");
              });
          }
        }

        function exportDataBackup() {
          const backup = {
            format: "gestione-cantieri-backup",
            version: 1,
            exportedAt: new Date().toISOString(),

            activityLog,
          };
          const blob = new Blob([JSON.stringify(backup, null, 2)], {
            type: "application/json",

          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = `gestione-cantieri-backup-${new Date().toISOString().split("T")[0]}.json`;
          document.body.appendChild(link);

        async function importDataBackup(file) {
          try {
            const backup = JSON.parse(await file.text());
            const importedSites = Array.isArray(backup) ? backup : backup.sites;
            if (
              !Array.isArray(importedSites) ||
              importedSites.some(
                (site) =>
                  !site ||
                  typeof site.id !== "string" ||
                  typeof site.name !== "string",
              )
            ) {
              throw new Error("Formato backup non valido");
            }
            if (
              !confirm(
                `Il ripristino sostituirà tutti i ${sites.length} cantieri attuali con ${importedSites.length} cantieri del backup. Continuare?`,
              )
            ) {
              return;
            }
            normalizeSites(importedSites);
            normalizeActivityLog(
              Array.isArray(backup.activityLog) ? backup.activityLog : [],
            );
            saveData();
            showDashboard();
            showToast("✅ Backup ripristinato");
          } catch (error) {
            console.error("Errore ripristino backup:", error);
            showToast("⚠️ File backup non valido o non leggibile");
          }
        }

        async function connectToCloud() {
          if (cloudConnectionPromise) return cloudConnectionPromise;

          cloudConnectionPromise = (async () => {
            try {
              if (!firebase.apps.length)
                firebase.initializeApp(FIREBASE_CONFIG);
              firestore = firebase.firestore();

              try {
                await firestore.enablePersistence({ synchronizeTabs: true });
              } catch (error) {
                if (
                  error.code !== "failed-precondition" &&
                  error.code !== "unimplemented"
                ) {
                  console.warn(
                    "Persistenza offline Firebase non disponibile:",
                    error,
                  );
                }
              }

              if (unsubscribeFromCloud) unsubscribeFromCloud();
              unsubscribeFromCloud = firestore.doc(CLOUD_DOCUMENT).onSnapshot(
                (snapshot) => {
                  if (!snapshot.exists || !Array.isArray(snapshot.data().sites))
                    return;
                  normalizeSites(snapshot.data().sites);
                  cloudSyncedSites = JSON.parse(JSON.stringify(sites));
                  normalizeActivityLog(snapshot.data().activityLog);
                  cloudSyncedActivityLog = JSON.parse(
                    JSON.stringify(activityLog),
                  );
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
                  localStorage.setItem(
                    STORAGE_KEY + "_activity",
                    JSON.stringify(activityLog),
                  );
                  if (currentView === "detail" && currentSiteId) {
                    renderSiteDetail(currentSiteId);
                  } else {
                    renderDashboard();
                  }
                },
                (error) => {
                  console.error("Errore ascolto Firebase:", error);
                  showToast("⚠️ Firebase offline: modifiche in coda");
                },
              );

              const document = await firestore.doc(CLOUD_DOCUMENT).get();
              if (document.exists && Array.isArray(document.data().sites)) {
                normalizeSites(document.data().sites);
                cloudSyncedSites = JSON.parse(JSON.stringify(sites));
                normalizeActivityLog(document.data().activityLog);
                cloudSyncedActivityLog = JSON.parse(
                  JSON.stringify(activityLog),
                );
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
                localStorage.setItem(
                  STORAGE_KEY + "_activity",
                  JSON.stringify(activityLog),
                );
              } else {
                const documentRef = firestore.doc(CLOUD_DOCUMENT);
                const initialSites = JSON.parse(JSON.stringify(sites));
                const initialActivityLog = JSON.parse(
                  JSON.stringify(activityLog),
                );
                await firestore.runTransaction(async (transaction) => {
                  const latestDocument = await transaction.get(documentRef);
                  if (!latestDocument.exists) {
                    transaction.set(documentRef, {
                      sites: initialSites,
                      activityLog: initialActivityLog,
                    });
                  }
                });
              }
            } catch (error) {
              console.error("Errore connessione Firebase:", error);
              showToast("⚠️ Firebase offline: modifiche in coda");
            } finally {
              cloudConnectionPromise = null;
            }
          })();

          return cloudConnectionPromise;
        }

        // CALCULATIONS

        function getTotalExpenses(site) {
          const matExp = (site.expenses || []).reduce(
            (sum, e) => sum + (parseFloat(e.amount) || 0),
            0,
          );
          const labExp = (site.labor || []).reduce(
            (sum, l) => sum + (parseFloat(l.amount) || 0),
            0,
          );
          return matExp + labExp;
        }

        function getTotalExtraWork(site) {
          return (site.extraWork || []).reduce(
            (sum, ew) => sum + (parseFloat(ew.amount) || 0),
            0,
          );
        }

        function getOutstandingExtraWork(site) {
          return (site.extraWork || []).reduce((sum, ew) => {
            const amount = parseFloat(ew.amount) || 0;
            const collected = parseFloat(ew.collected) || 0;
            return sum + Math.max(0, amount - collected);
          }, 0);
        }

        function getTotalCollections(site) {
          return (site.collections || []).reduce(
            (sum, c) => sum + (parseFloat(c.amount) || 0),
            0,
          );
        }

        function getProfit(site) {
          return getTotalCollections(site) - getTotalExpenses(site);
        }

        function getExpectedProfit(site) {
          const quote = parseFloat(site.quoteAmount) || 0;
          return quote + getTotalExtraWork(site) - getTotalExpenses(site);
        }

        function getToCollect(site) {
          const quote = parseFloat(site.quoteAmount) || 0;
          const extraWork = getTotalExtraWork(site);
          const collected = getTotalCollections(site);
          return Math.max(0, quote + extraWork - collected);
        }

        function getGlobalStats() {
          let totalQuote = 0,
            totalExtraWork = 0,
            totalOutstandingExtraWork = 0,
            totalExp = 0,
            totalColl = 0,
            totalProfit = 0,
            totalExpectedProfit = 0;
          sites.forEach((s) => {
            totalQuote += parseFloat(s.quoteAmount) || 0;
            totalExtraWork += getTotalExtraWork(s);
            totalOutstandingExtraWork += getOutstandingExtraWork(s);
            totalExp += getTotalExpenses(s);
            totalColl += getTotalCollections(s);
            totalProfit += getProfit(s);
            totalExpectedProfit += getExpectedProfit(s);
          });
          return {
            totalQuote,
            totalExtraWork,
            totalOutstandingExtraWork,
            totalExp,
            totalColl,
            totalToCollect: Math.max(
              0,
              totalQuote + totalExtraWork - totalColl,
            ),
            totalProfit,
            totalExpectedProfit,
            activeCount: sites.filter((s) => s.status === "In corso").length,
          };
        }

        // ─────────────────────────────────────

        // ─────────────────────────────────────
        function fmtEuro(val) {
          const n = parseFloat(val) || 0;
          const abs = Math.abs(n);
          const formatted = abs.toLocaleString("it-IT", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
          return n < 0 ? "−€" + formatted : "€" + formatted;
        }

        function fmtDate(dateStr) {
          if (!dateStr) return "";
          const parts = dateStr.split("-");
          return parts[2] + "/" + parts[1] + "/" + parts[0];
        }

        function openModal(title, fields, onSubmit) {
          modalReturnFocus = document.activeElement;
          modalTitle.textContent = title;
          modalBody.innerHTML = "";
          modalSave.classList.remove("hidden");
          modalCancel.textContent = "Annulla";
          fields.forEach((f) => {
            const group = document.createElement("div");
            group.className = "form-group";
            const label = document.createElement("label");
            label.textContent = f.label + (f.required ? " *" : "");
            group.appendChild(label);

            let input;
            if (f.type === "select") {
              input = document.createElement("select");
              f.options.forEach((opt) => {
                const optionValue = typeof opt === "object" ? opt.value : opt;
                const optionLabel = typeof opt === "object" ? opt.label : opt;
                const o = document.createElement("option");
                o.value = optionValue;
                o.textContent = optionLabel;
                if (f.value === optionValue) o.selected = true;
                input.appendChild(o);
              });
            } else if (f.type === "textarea") {
              input = document.createElement("textarea");
              input.value = f.value || "";
              input.placeholder = f.placeholder || "";
            } else {
              input = document.createElement("input");
              input.type = f.type || "text";
              input.value = f.value || "";
              input.placeholder = f.placeholder || "";
              if (f.type === "number") {
                input.step = "0.01";
                input.min = f.min !== undefined ? f.min : "0";
                if (f.max !== undefined) input.max = f.max;
              }
            }
            if (f.required) input.required = true;
            input.setAttribute("data-field-name", f.name);
            input.id = "modal-field-" + f.name;
            label.htmlFor = input.id;
            group.appendChild(input);
            modalBody.appendChild(group);
          });
          modalCallback = (formData) => onSubmit(formData);
          modalOverlay.classList.remove("hidden");
          const firstField = modalBody.querySelector("input, select, textarea");
          if (firstField) firstField.focus();
        }

        function closeModal() {
          modalOverlay.classList.add("hidden");
          modalCallback = null;
          modalSave.classList.remove("hidden");
          modalCancel.textContent = "Annulla";
          const returnFocus = modalReturnFocus;
          modalReturnFocus = null;
          if (
            returnFocus &&
            returnFocus.isConnected &&
            !returnFocus.closest(".hidden")
          ) {
            returnFocus.focus();
          }
        }

        function attachExtraCollectionLimit(site, collection = null) {
          const extraSelect = modalBody.querySelector(
            '[data-field-name="extraWorkId"]',
          );
          const amountInput = modalBody.querySelector(
            '[data-field-name="amount"]',
          );
          if (!extraSelect || !amountInput) return;

          const updateLimit = (resetAmount = false) => {
            const extra = (site.extraWork || []).find(
              (item) => item.id === extraSelect.value,
            );
            if (!extra) {
              amountInput.removeAttribute("max");
              return;
            }
            const currentPayment =
              collection && collection.extraWorkId === extra.id
                ? parseFloat(collection.amount) || 0
                : 0;
            const remaining = Math.max(
              0,
              (parseFloat(extra.amount) || 0) -
                (parseFloat(extra.collected) || 0) +
                currentPayment,
            );
            amountInput.max = remaining.toFixed(2);
            if (
              resetAmount ||
              !amountInput.value ||
              (parseFloat(amountInput.value) || 0) > remaining
            ) {
              amountInput.value = remaining.toFixed(2);
            }
          };

          extraSelect.addEventListener("change", () => updateLimit(true));
          updateLimit();
        }

          let filtered = sites.slice().sort((left, right) => {
            const leftCreatedAt = Date.parse(left.createdAt || "");
            const rightCreatedAt = Date.parse(right.createdAt || "");
            const leftHasTimestamp = Number.isFinite(leftCreatedAt);
            const rightHasTimestamp = Number.isFinite(rightCreatedAt);

              return leftHasTimestamp ? -1 : 1;

        function handleDeleteItem(siteId, section, itemId) {
          const site = sites.find((s) => s.id === siteId);
          if (!site) return;
          const sectionMap = {
            expense: "expenses",
            labor: "labor",
            extraWork: "extraWork",
            collection: "collections",
            document: "documents",
            reminder: "reminders",
          };
          const key = sectionMap[section];
          if (!key || !site[key]) return;

          const sectionLabels = {
            expense: "questa spesa materiale",
            labor: "questa voce di manodopera",
            extraWork: "questo lavoro extra",
            collection: "questo incasso",
            document: "questo documento",
            reminder: "questo promemoria",
          };
          const item = site[key].find((entry) => entry.id === itemId);
          if (!item) return;
          const itemName = item.description || item.name || item.title || "";
          const detail = itemName ? `\n\n${itemName}` : "";
          const confirmed = confirm(
            `Confermi di voler eliminare ${sectionLabels[section] || "questo elemento"}?${detail}\n\nQuesta operazione non può essere annullata.`,
          );
          if (!confirmed) return;
          if (section === "collection" && item.extraWorkId) {
            const relatedExtra = (site.extraWork || []).find(
              (extra) => extra.id === item.extraWorkId,
            );
            if (relatedExtra) {
              relatedExtra.collected = Math.max(
                0,
                (parseFloat(relatedExtra.collected) || 0) -
                  (parseFloat(item.amount) || 0),
              );
            }
          }
          if (section === "extraWork") {
            site.collections.forEach((collection) => {
              if (collection.extraWorkId === item.id)
                delete collection.extraWorkId;
            });
          }
          site[key] = site[key].filter((item) => item.id !== itemId);
          saveData(`Elemento eliminato: ${itemName}`, item.amount, site.name);
          renderSiteDetail(siteId);
          showToast("🗑️ Elemento eliminato");
        }

        function toggleReminder(siteId, itemId, done) {
          const site = sites.find((s) => s.id === siteId);
          if (!site) return;
          const reminder = (site.reminders || []).find((r) => r.id === itemId);
          if (reminder) {
            reminder.done = done;
            saveData(done ? "Promemoria completato" : "Promemoria riaperto");
            renderSiteDetail(siteId);
          }
        }

        function getExpensePhotoStorageSize() {
          return sites.reduce(
            (total, site) =>
              total +

        async function compressExpensePhoto(file, replacingPhoto = "") {
          if (!file || !file.type.startsWith("image/")) {
            throw new Error("Seleziona un file immagine valido");
          }
          if (file.size > MAX_EXPENSE_PHOTO_FILE_SIZE) {
            throw new Error("La foto originale deve essere inferiore a 12 MB");
          }

          const sourceUrl = URL.createObjectURL(file);
          try {
            const image = new Image();
            image.src = sourceUrl;
            await image.decode();
            let scale = Math.min(
              1,
              1280 / Math.max(image.naturalWidth, image.naturalHeight),
            );
            let quality = 0.76;
            let blob = null;

            for (let attempt = 0; attempt < 10; attempt++) {
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(
                1,
                Math.round(image.naturalWidth * scale),
              );
              canvas.height = Math.max(
                1,
                Math.round(image.naturalHeight * scale),
              );
              const context = canvas.getContext("2d");
              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, canvas.width, canvas.height);
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              blob = await new Promise((resolve) =>
                canvas.toBlob(resolve, "image/jpeg", quality),
              );
              if (blob && blob.size <= MAX_EXPENSE_PHOTO_SIZE) break;
              if (quality > 0.5) quality -= 0.08;
              else {
                scale *= 0.78;
                quality = 0.68;
              }
            }

            if (!blob || blob.size > MAX_EXPENSE_PHOTO_SIZE) {
              throw new Error(
                "Non riesco a comprimere la foto abbastanza; prova un’immagine più piccola",
              );
            }
            const photoData = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () =>
                reject(new Error("Lettura foto non riuscita"));
              reader.readAsDataURL(blob);
            });
            const storedSize =
              getExpensePhotoStorageSize() -
              replacingPhoto.length +
              photoData.length;
            if (storedSize > MAX_EXPENSE_PHOTO_ARCHIVE_SIZE) {
              throw new Error(
                "Archivio foto pieno: rimuovi una foto o esporta e archivia un backup",
              );
            }
            return photoData;
          } finally {
            URL.revokeObjectURL(sourceUrl);
          }
        }

        function appendExpensePhotoPicker(existingPhoto = "") {
          let currentPhoto = existingPhoto;
          let selectedPhoto = "";
          let processing = false;
          const group = document.createElement("div");
          group.className = "form-group";
          const label = document.createElement("label");
          label.textContent = "Foto scontrino o materiale (opzionale)";
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.capture = "environment";
          input.setAttribute(
            "aria-label",
            "Scegli o scatta una foto della spesa",
          );
          const preview = document.createElement("div");
          preview.className = "expense-photo-preview";
          const removeLabel = document.createElement("label");
          const removeCheckbox = document.createElement("input");
          removeCheckbox.type = "checkbox";
          removeCheckbox.setAttribute("aria-label", "Rimuovi la foto allegata");
          removeLabel.append(
            removeCheckbox,
            document.createTextNode(" Rimuovi foto allegata"),
          );
          removeLabel.style.display = existingPhoto ? "block" : "none";

          const showPhoto = (photo, description) => {
            preview.replaceChildren();
            if (!photo) {
              preview.hidden = true;
              return;
            }
            const image = document.createElement("img");
            image.src = photo;
            image.alt = description;
            const text = document.createElement("span");
            text.textContent = description;
            preview.append(image, text);
            preview.hidden = false;
          };
          showPhoto(
            existingPhoto,
            existingPhoto ? "Foto attualmente allegata" : "",
          );
          input.addEventListener("change", async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            processing = true;
            modalSave.disabled = true;
            try {
              selectedPhoto = await compressExpensePhoto(file, existingPhoto);
              removeCheckbox.checked = false;
              removeLabel.style.display = existingPhoto ? "block" : "none";
              showPhoto(
                selectedPhoto,
                "Nuova foto compressa e pronta al salvataggio",
              );
            } catch (error) {
              selectedPhoto = "";
              input.value = "";
              showPhoto(
                existingPhoto,
                existingPhoto ? "Foto attualmente allegata" : "",
              );
              showToast(`⚠️ ${error.message}`);
            } finally {
              processing = false;
              modalSave.disabled = false;
            }
          });
          removeCheckbox.addEventListener("change", () => {
            if (removeCheckbox.checked) showPhoto("", "");
            else showPhoto(selectedPhoto || existingPhoto, "Foto allegata");
          });
          group.append(label, input, preview, removeLabel);
          modalBody.appendChild(group);

          return {
            getPhoto() {
              return {
                changed: Boolean(selectedPhoto) || removeCheckbox.checked,
                value: removeCheckbox.checked
                  ? ""
                  : selectedPhoto || currentPhoto,
              };
            },
            isProcessing: () => processing,
          };
        }

                  : "Ore (opzionale)",
                type: "number",
                required: workerRate > 0,
                min: workerRate ? "0.01" : "0",
                value: String(item.hours || ""),
              },
            ];
            if (!workerRate) {
              fields.push({
                name: "amount",
                label: "Importo totale (€)",
                type: "number",
                required: true,
                min: "0.01",
                value: String(item.amount || 0),
              });
            }
          } else if (section === "extraWork") {
            title = "Modifica lavoro extra";
            fields = [
              {
                name: "description",
                label: "Descrizione",
                type: "text",
                required: true,
                value: item.description || "",
              },
              {
                name: "amount",
                label: "Importo (€)",
                type: "number",
                required: true,
                min: String(parseFloat(item.collected) || 0),
                value: String(item.amount || 0),
              },
            ];
          } else if (section === "collection") {
            title = "Modifica incasso";
            fields = [
              {
                name: "date",
                label: "Data",
                type: "date",
                required: true,
                value: item.date || "",
              },
              {
                name: "amount",
                label: "Importo (€)",
                type: "number",
                required: true,
                min: "0.01",
                value: String(item.amount || 0),
              },
              {
                name: "method",
                label: "Metodo di pagamento",
                type: "select",
                required: true,
                options: ["Bonifico", "Contanti", "Assegno", "Carta", "Altro"],
                value: item.method || "Bonifico",
              },
            ];
            if ((site.extraWork || []).length > 0) {
              fields.push({
                name: "extraWorkId",
                label: "Lavoro extra associato",
                type: "select",
                required: false,
                value: item.extraWorkId || "",
                options: [
                  { value: "", label: "Incasso generico" },
                  ...site.extraWork
                    .filter(
                      (extra) =>
                        extra.id === item.extraWorkId ||
                        (parseFloat(extra.amount) || 0) >
                          (parseFloat(extra.collected) || 0),
                    )
                    .map((extra) => ({
                      value: extra.id,
                      label: extra.description,
                    })),
                ],
              });
            }
          } else if (section === "document") {
            title = "Modifica documento";
            fields = [
              {
                name: "name",
                label: "Nome documento",
                type: "text",
                required: true,
                value: item.name || "",
              },
              {
                name: "type",
                label: "Tipo",
                type: "select",
                required: true,
                options: [
                  "Preventivo",
                  "Fattura",
                  "Contratto",
                  "Foto",
                  "Altro",
                ],
                value: item.type || "Altro",
              },
              {
                name: "date",
                label: "Data",
                type: "date",
                required: false,
                value: item.date || "",
              },
              {
                name: "url",
                label: "Link / URL (opzionale)",
                type: "text",
                required: false,
                value: item.url || "",
              },
            ];
          } else if (section === "reminder") {
            title = "Modifica promemoria";
            fields = [
              {
                name: "text",
                label: "Testo",
                type: "text",
                required: true,
                value: item.text || "",
              },
              {
                name: "date",
                label: "Scadenza (opzionale)",
                type: "date",
                required: false,
                value: item.date || "",
              },
            ];
          } else {
            return;
          }

          let expensePhotoPicker = null;
          openModal(title, fields, (data) => {
            if (section === "expense") {
              Object.assign(item, {
                date: data.date,
                category: data.category,
                description: data.description,
                amount: data.amount,
              });
              const photo = expensePhotoPicker.getPhoto();
              if (photo.changed) {
                if (photo.value) item.photo = photo.value;
                else delete item.photo;
              }
            } else if (section === "labor") {
              item.description = data.description;
              item.hours = parseFloat(data.hours) || 0;
              if (workerRate) {
                item.hourlyRate = workerRate;
                item.amount = item.hours * workerRate;
              } else {
                item.amount = data.amount;
              }
            } else if (section === "extraWork") {
              item.description = data.description;
              item.amount = data.amount;
            } else if (section === "collection") {
              const oldExtra = (site.extraWork || []).find(
                (extra) => extra.id === item.extraWorkId,
              );
              if (oldExtra) {
                oldExtra.collected = Math.max(
                  0,
                  (parseFloat(oldExtra.collected) || 0) -
                    (parseFloat(item.amount) || 0),
                );
              }
              const newExtra = (site.extraWork || []).find(
                (extra) => extra.id === data.extraWorkId,
              );
              const amount = parseFloat(data.amount) || 0;
              if (newExtra) {
                const remaining = Math.max(
                  0,
                  (parseFloat(newExtra.amount) || 0) -
                    (parseFloat(newExtra.collected) || 0),
                );
                if (amount > remaining) return;
                newExtra.collected =
                  (parseFloat(newExtra.collected) || 0) + amount;
                item.extraWorkId = newExtra.id;
                item.description = `Incasso extra: ${newExtra.description}`;
              } else {
                delete item.extraWorkId;
                delete item.description;
              }
              item.date = data.date;
              item.amount = amount;
              item.method = data.method;
            } else if (section === "document") {
              Object.assign(item, {
                name: data.name,
                type: data.type,
                date: data.date,
                url: data.url,
              });
            } else if (section === "reminder") {
              Object.assign(item, { text: data.text, date: data.date });
            }
            saveData(
              `Voce modificata: ${item.description || item.name || item.text || section}`,
              item.amount,
              site.name,
            );
            renderSiteDetail(siteId);
            showToast("✅ Voce aggiornata");
          });
          if (section === "expense") {
            expensePhotoPicker = appendExpensePhotoPicker(item.photo || "");
          }
          if (section === "collection" && item.extraWorkId)
            attachExtraCollectionLimit(site, item);
        }

        function openExpenseModal(siteId) {
          const today = new Date().toISOString().split("T")[0];
          let expensePhotoPicker = null;
          openModal(
            "Nuova spesa di cantiere",
            [
              {
                name: "date",
                label: "Data",
                type: "date",
                required: true,
                value: today,
              },
              {
                name: "category",
                label: "Categoria",
                type: "select",
                required: true,
                options: EXPENSE_CATEGORIES.filter(
                  (category) => category !== "Non categorizzata",
                ),
                value: "Materiali",
              },
              {
                name: "description",
                label: "Descrizione",
                type: "text",
                required: true,
                placeholder: "es. Piastrelle 60x60",
              },
              {
                name: "amount",
                label: "Importo (€)",
                type: "number",
                required: true,
                min: "0.01",
                value: "0",
              },
            ],
            (data) => {
              const site = sites.find((s) => s.id === siteId);
              if (!site) return;
              site.expenses.push({
                id: generateId(),
                date: data.date,
                category: data.category,
                description: data.description,
                amount: parseFloat(data.amount) || 0,
              });
              const photo = expensePhotoPicker.getPhoto();
              if (photo.value)
                site.expenses[site.expenses.length - 1].photo = photo.value;
              saveData(
                `Spesa aggiunta (${data.category}): ${data.description}`,
                data.amount,
              );
              renderSiteDetail(siteId);
              showToast("✅ Spesa aggiunta");
            },
          );
          expensePhotoPicker = appendExpensePhotoPicker();
        }

        function openLaborModal(siteId) {
          openModal(
            "Aggiungi operaio",
            [
              {
                name: "description",
                label: "Nome operaio",
                type: "text",
                required: true,
                placeholder: "es. Mario Rossi",
              },
              {
                name: "hours",
                label: `Ore lavorate (${fmtEuro(WORKER_HOURLY_RATE)}/ora)`,
                type: "number",
                required: true,
                min: "0.01",
                value: "",
              },
            ],
            (data) => {
              const site = sites.find((s) => s.id === siteId);
              if (!site) return;
              const hours = parseFloat(data.hours) || 0;
              const amount = hours * WORKER_HOURLY_RATE;
              site.labor.push({
                id: generateId(),
                description: data.description,
                hours,
                hourlyRate: WORKER_HOURLY_RATE,
                amount,
              });
              saveData(
                `Operaio aggiunto: ${data.description} (${hours} ore)`,
                amount,
              );
              renderSiteDetail(siteId);
              showToast(`✅ Costo operaio: ${fmtEuro(amount)}`);
            },
          );
        }

        function openExtraWorkModal(siteId) {
          openModal(
            "Nuovo Lavoro Extra",
            [
              {
                name: "description",
                label: "Descrizione",
                type: "text",
                required: true,
                placeholder: "es. Riparazione tubo",
              },
              {
                name: "amount",
                label: "Importo (€)",
                type: "number",
                required: true,
                min: "0",
                value: "0",
              },
            ],
            (data) => {
              const site = sites.find((s) => s.id === siteId);
              if (!site) return;
              site.extraWork.push({
                id: generateId(),
                description: data.description,
                amount: parseFloat(data.amount) || 0,
              });
              saveData(
                `Lavoro extra aggiunto: ${data.description}`,
                data.amount,
              );
              renderSiteDetail(siteId);
              showToast("✅ Lavoro extra aggiunto");
            },
          );
        }

        function openExtraCollectionModal(siteId, extraId) {
          const site = sites.find((s) => s.id === siteId);
          const extra =
            site && (site.extraWork || []).find((item) => item.id === extraId);
          if (!extra) return;

          const remaining = Math.max(
            0,
            (parseFloat(extra.amount) || 0) -
              (parseFloat(extra.collected) || 0),
          );
          if (remaining <= 0) return;

          const today = new Date().toISOString().split("T")[0];
          openModal(
            "Incassa lavoro extra",
            [
              {
                name: "date",
                label: "Data",
                type: "date",
                required: true,
                value: today,
              },
              {
                name: "amount",
                label: "Importo incassato (€)",
                type: "number",
                required: true,
                min: "0.01",
                max: String(remaining),
                value: String(remaining),
              },
              {
                name: "method",
                label: "Metodo di pagamento",
                type: "select",
                required: true,
                options: ["Bonifico", "Contanti", "Assegno", "Carta", "Altro"],
                value: "Bonifico",
              },
            ],
            (data) => {
              const amount = Math.min(parseFloat(data.amount) || 0, remaining);
              if (amount <= 0) return;
              extra.collected = (parseFloat(extra.collected) || 0) + amount;
              site.collections.push({
                id: generateId(),
                date: data.date,
                amount,
                method: data.method,
                extraWorkId: extra.id,
                description: `Incasso extra: ${extra.description}`,
              });
              saveData(
                `Incasso extra registrato: ${extra.description}`,
                amount,
              );
              renderSiteDetail(siteId);
              showToast("✅ Incasso extra registrato");
            },
          );
        }

        function openCollectionModal(siteId) {
          const site = sites.find((s) => s.id === siteId);
          if (!site) return;
          const today = new Date().toISOString().split("T")[0];
          const fields = [
            {
              name: "date",
              label: "Data",
              type: "date",
              required: true,
              value: today,
            },
            {
              name: "amount",
              label: "Importo (€)",
              type: "number",
              required: true,
              min: "0.01",
              value: "0",
            },
            {
              name: "method",
              label: "Metodo di pagamento",
              type: "select",
              required: true,
              options: ["Bonifico", "Contanti", "Assegno", "Carta", "Altro"],
              value: "Bonifico",
            },
          ];
          const openExtras = (site.extraWork || []).filter((extra) => {
            const remaining =
              (parseFloat(extra.amount) || 0) -
              (parseFloat(extra.collected) || 0);
            return remaining > 0;
          });
          if (openExtras.length > 0) {
            fields.push({
              name: "extraWorkId",
              label: "Collega a un lavoro extra (opzionale)",
              type: "select",
              required: false,
              value: "",
              options: [
                { value: "", label: "Incasso generico" },
                ...openExtras.map((extra) => ({
                  value: extra.id,
                  label: `${extra.description} · residuo ${fmtEuro((parseFloat(extra.amount) || 0) - (parseFloat(extra.collected) || 0))}`,
                })),
              ],
            });
          }
          openModal("Nuovo Incasso", fields, (data) => {
            const extra = openExtras.find(
              (item) => item.id === data.extraWorkId,
            );
            const amount = parseFloat(data.amount) || 0;
            if (extra) {
              const remaining = Math.max(
                0,
                (parseFloat(extra.amount) || 0) -
                  (parseFloat(extra.collected) || 0),
              );
              if (amount > remaining) return;
              extra.collected = (parseFloat(extra.collected) || 0) + amount;
            }
            site.collections.push({
              id: generateId(),
              date: data.date,
              amount,
              method: data.method,
              ...(extra
                ? {
                    extraWorkId: extra.id,
                    description: `Incasso extra: ${extra.description}`,
                  }
                : {}),
            });
            saveData(
              extra
                ? `Incasso extra registrato: ${extra.description}`
                : "Incasso aggiunto",
              amount,
            );
            renderSiteDetail(siteId);
            showToast("✅ Incasso registrato");
          });
          if (openExtras.length > 0) attachExtraCollectionLimit(site);
        }

        function openDocumentModal(siteId) {
          const today = new Date().toISOString().split("T")[0];
          openModal(
            "Nuovo Documento",
            [
              {
                name: "name",
                label: "Nome documento",
                type: "text",
                required: true,
                placeholder: "es. Fattura acconto",
              },
              {
                name: "type",
                label: "Tipo",
                type: "select",
                required: true,
                options: [
                  "Preventivo",
                  "Fattura",
                  "Contratto",
                  "Foto",
                  "Altro",
                ],
                value: "Fattura",
              },
              {
                name: "date",
                label: "Data",
                type: "date",
                required: false,
                value: today,
              },
              {
                name: "url",
                label: "Link / URL (opzionale)",
                type: "text",
                required: false,
                placeholder: "https://...",
              },
            ],
            (data) => {
              const site = sites.find((s) => s.id === siteId);
              if (!site) return;
              site.documents.push({
                id: generateId(),
                name: data.name,
                type: data.type,
                date: data.date || today,
                url: data.url || "",
              });
              saveData(`Documento aggiunto: ${data.name}`);
              renderSiteDetail(siteId);
              showToast("✅ Documento aggiunto");
            },
          );
        }

        function openReminderModal(siteId) {
          const today = new Date().toISOString().split("T")[0];
          openModal(
            "Nuovo Promemoria",
            [
              {
                name: "text",
                label: "Testo",
                type: "text",
                required: true,
                placeholder: "es. Ordinare materiali",
              },
              {
                name: "date",
                label: "Scadenza (opzionale)",
                type: "date",
                required: false,
                value: today,
              },
            ],
            (data) => {
              const site = sites.find((s) => s.id === siteId);
              if (!site) return;
              site.reminders.push({
                id: generateId(),
                text: data.text,
                date: data.date || "",
                done: false,
              });
              saveData(`Promemoria aggiunto: ${data.text}`);
              renderSiteDetail(siteId);
              showToast("✅ Promemoria aggiunto");
            },
          );
        }

        // ─────────────────────────────────────
        // SEARCH
        // ─────────────────────────────────────
        searchInput.addEventListener("input", () => {
          if (currentView === "dashboard") renderDashboard();
        });

        // ─────────────────────────────────────
        // INIT
        // ─────────────────────────────────────
        async function init() {
          await loadData();
          showDashboard();
        }

        console.log("🏗️  Gestione Cantieri Edili — App pronta!");
        console.log("   📱 Ottimizzata per smartphone e PC");
        console.log("   💾 Dati salvati in localStorage");
        console.log("   🧮 Calcoli automatici attivi");
      })();
    </script>
  </body>
</html>
